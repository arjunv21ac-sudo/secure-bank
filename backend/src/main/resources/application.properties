spring.application.name=securebank
# Hosting platforms like Render provide the port in the PORT environment variable
server.port=${PORT:8080}

# ---------- MySQL ----------
# Locally the database is created automatically on first run.
# In production set DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/securebank_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Must be at least 32 characters. Override with JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:securebank-dev-secret-key-change-this-in-production-2026}
# Banking sessions are short: 30 minutes
app.jwt.expiration-ms=1800000

# ---------- Banking rules ----------
app.bank.daily-debit-limit=50000.00
app.bank.max-deposit=200000.00
app.bank.max-failed-logins=3

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Demo data ----------
app.seed.enabled=${SEED_DATA:true}
